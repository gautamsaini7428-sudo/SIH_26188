version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./verifications.db:/app/verifications.db
      - ./uploads:/app/uploads
      - ./audit_log.json:/app/audit_log.json
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./verifications.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
